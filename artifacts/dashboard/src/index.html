<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom Treasury</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0b;
      --surface: #111113;
      --border:  rgba(255,255,255,0.07);
      --text:    #e8e8ea;
      --muted:   rgba(255,255,255,0.38);
      --red:     #c0392b;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 52px; height: 52px;
      border-radius: 0.75rem;
      background: var(--red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { font-size: 0.825rem; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: middle; position: relative; top: -1px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">K</div>
    <h1>Kingdom Treasury</h1>
    <p>The admin dashboard is being rebuilt from a clean foundation.<br>Check back shortly.</p>
    <div class="badge"><span class="dot"></span>Rebuild in progress</div>
  </div>
</body>
</html>
