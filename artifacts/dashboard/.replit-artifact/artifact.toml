kind = "web"
previewPath = "/dashboard/"
title = "Kingdom Treasury Dashboard"
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dashboard/" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
publicDir = "artifacts/dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8080"
BASE_PATH = "/dashboard/"
