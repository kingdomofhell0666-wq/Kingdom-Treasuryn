kind = "web"
previewPath = "/exchange/"
title = "Kingdom Exchange"
version = "1.0.0"
id = "artifacts/exchange"
router = "path"

[[services]]
name = "web"
paths = ["/exchange"]
localPort = 5001

[services.development]
run = "pnpm --filter @workspace/exchange run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/exchange", "run", "build"]
publicDir = "artifacts/exchange/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
